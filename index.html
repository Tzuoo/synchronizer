function formatStructuredSelection(playType,selection){
  const play=String(playType||"").trim();
  const raw=String(selection||"").trim();
  if(!raw)return "";
  const parts=raw.split("、").map(x=>x.trim()).filter(Boolean);

  // 柱碰：不依賴「、」或換行；直接依「第XX柱」切割，每柱固定直向一行。
  if(/柱碰/.test(play)){
    const pillars=[];
    const re=/(第\d{1,2}柱)\s*([\s\S]*?)(?=第\d{1,2}柱|$)/g;
    let m;
    while((m=re.exec(raw))){
      const label=m[1].trim();
      const values=m[2].trim().replace(/^[、,\s]+|[、\s]+$/g,"");
      pillars.push(`<div class="pillar-line"><span class="pillar-label">${label}</span><span class="pillar-values">${values}</span></div>`);
    }
    if(pillars.length)return pillars.join("");
    return parts.map(line=>`<div class="pillar-line"><span class="pillar-values">${line}</span></div>`).join("");
  }

  // 天碰：特碼 / 正碼各自一行
  if(/^天碰/.test(play)){
    return parts.map(line=>`<div class="bet-line">${line}</div>`).join("");
  }

  // 特碼單碰：每個號碼與金額一行
  if(/特碼單碰/.test(play)){
    return parts.map(line=>{
      const m=line.match(/^(\d{1,2})\s+([\d.]+)$/);
      if(!m)return `<div class="bet-line">${line}</div>`;
      const amount=Number(m[2]);
      return `<div class="bet-line"><span>${m[1]}</span><span class="detail-value">${money(amount)}</span></div>`;
    }).join("");
  }

  // 全車單碰：每個號碼與車數一行
  if(/全車單碰/.test(play)){
    return parts.map(line=>{
      const m=line.match(/^(\d{1,2})\s+([\d.]+)車$/);
      if(!m)return `<div class="bet-line">${line}</div>`;
      return `<div class="bet-line"><span>${m[1]}</span><span class="detail-value">${m[2]}車</span></div>`;
    }).join("");
  }

  return raw;
}


function isDeletedBet(b){
  if(b.deleted===true||b.isDeleted===true)return true;
  const haystack=[
    b.status,b.result,b.rawText,b.event,b.playType,b.selection,b.note,b.remark
  ].filter(v=>v!=null).join(" ");
  return /已刪單|刪單|已删除|已刪除|deleted|cancelled|canceled/i.test(haystack);
}

document.addEventListener('click',e=>{const s=e.target.closest('[data-site]');if(s){site=s.dataset.site;draw()}const c=e.target.closest('[data-ids]');if(c){const ids=JSON.parse(decodeURIComponent(c.dataset.ids)),value=c.dataset.value==='true';ids.forEach(id=>{reconciledCache[id]=value});saveReconciledCache();bets=bets.map(b=>ids.includes(b.id)?{...b,reconciled:value}:b);draw();Promise.all(ids.map(id=>fetch(API+'/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({reconciled:value})}))).catch(()=>{})}});$("#query").oninput=draw;$("#theme").onclick=()=>{const v=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=v;localStorage.setItem('theme',v)};document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark';load();setInterval(load,2000);
$("#refresh").onclick=load;$("#loadTest").onclick=loadTestData;$("#clearAll").onclick=clearAll;window.addEventListener('focus',load);window.addEventListener('pageshow',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
