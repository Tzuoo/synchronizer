<script>
const lock=document.querySelector('#lock'),lockForm=document.querySelector('#lockForm'),lockPassword=document.querySelector('#lockPassword'),lockError=document.querySelector('#lockError');
const API_ROOT="https://live-bet-reconciliation.tsoyis0520.chatgpt.site/api",API=`${API_ROOT}/bets`,IS_LEDGER_DEMO=new URLSearchParams(location.search).get('ledger-demo')==='1';
let authToken=sessionStorage.getItem('synchronizerSession')||'';
if(authToken)lock.classList.add('hidden');
function authHeaders(extra={}){return {...extra,authorization:`Bearer ${authToken}`}}
function requireLogin(message='登入已失效，請重新輸入密碼'){authToken='';sessionStorage.removeItem('synchronizerSession');lock.classList.remove('hidden');lockError.textContent=message;lockPassword.focus()}
lockForm.addEventListener('submit',async e=>{e.preventDefault();lockError.textContent='驗證中…';try{const r=await fetch(`${API_ROOT}/auth`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:lockPassword.value})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.token){lockError.textContent=r.status===429?'嘗試次數過多，請稍後再試':'密碼錯誤，請重新輸入';lockPassword.select();return}authToken=data.token;sessionStorage.setItem('synchronizerSession',authToken);lock.classList.add('hidden');lockPassword.value='';lockError.textContent='';await load()}catch{lockError.textContent='暫時無法登入，請稍後再試'}});
const BUILD="38",names=["風雲","98","喜","16","28","海勝","航海"];let bets=[],site="全部網站",renderSignature="";let reconciledCache=JSON.parse(localStorage.getItem('synchronizerReconciled')||'{}');const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat("zh-TW",{style:"currency",currency:"TWD",maximumFractionDigits:0}).format(Number(n)||0);function saveReconciledCache(){localStorage.setItem('synchronizerReconciled',JSON.stringify(reconciledCache))}function orderSignature(rows){return rows.map(b=>[b.id,b.source,b.account,b.placedAt,b.event,b.selection,b.odds,b.stake,b.potentialPayout,b.playType,b.unitAmount,b.combinationCount,b.carCount,b.betAmount,b.parseStatus,b.status,b.result,b.reconciled]).join('|')}function betTotal(b){if(b._sixBatch)return Number(b.potentialPayout||0);if(b.source==="風雲")return Number(b.stake||0);if(b.source==="海勝")return Number(b.potentialPayout||0);return Number(b.potentialPayout??b.stake??0)}fetch(`version.json?ts=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).then(v=>{if(String(v.build)!==BUILD){const url=new URL(location.href);url.searchParams.set('build',String(v.build));location.replace(url)}}).catch(()=>{});
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
const LEDGER_DEMO={date:'2026-08-26',game:'539',phase:'C115207',sites:[
  {source:'98',account:'a6539',rows:[['全車',2280,2120],['三星',3000,0],['四星',17300,0]]},
  {source:'喜',account:'a0593',rows:[['正碼',110960,26500]]},
  {source:'海勝',account:'0593',rows:[['全車',5510,0],['二星',8000,0],['三星',9000,0]]},
  {source:'16',account:'you320',rows:[['二星',3000,0],['三星',2000,0]]}
]};
const LEDGER_PLAY_ORDER=['正碼','全車','二星','三星','四星'];
function summarizeLedger(sites){
  const totals=new Map(),sources=new Map();
  sites.forEach(site=>site.rows.forEach(([play,total,winning])=>{
    const current=totals.get(play)||[0,0];
    current[0]+=Number(total)||0;current[1]+=Number(winning)||0;totals.set(play,current);
    if(!sources.has(play))sources.set(play,[]);
    sources.get(play).push([site.source,Number(total)||0,Number(winning)||0]);
  }));
  return [...totals].map(([play,[total,winning]])=>[play,total,winning,sources.get(play)]).sort((a,b)=>{
    const ai=LEDGER_PLAY_ORDER.indexOf(a[0]),bi=LEDGER_PLAY_ORDER.indexOf(b[0]);
    return (ai<0?999:ai)-(bi<0?999:bi);
  });
}
function ledgerTable(rows,totalLabel='總計',showEquation=false){
  const totals=rows.reduce((sum,row)=>[sum[0]+Number(row[1]||0),sum[1]+Number(row[2]||0)],[0,0]);
  const ordered=[...rows].sort((a,b)=>{const ai=LEDGER_PLAY_ORDER.indexOf(a[0]),bi=LEDGER_PLAY_ORDER.indexOf(b[0]);return (ai<0?999:ai)-(bi<0?999:bi)});
  const body=ordered.map(([play,total,winning,sources])=>{const totalEquation=showEquation&&sources?.length>1?`${sources.map(([source,value])=>`${escapeHtml(source)} ${money(value)}`).join(' ＋ ')} ＝ ${money(total)}`:'';const winningEquation=showEquation&&sources?.length>1?`${sources.map(([source,,value])=>`${escapeHtml(source)} ${money(value)}`).join(' ＋ ')} ＝ ${money(winning)}`:'';return `<tr><td>${escapeHtml(play)}</td><td class="ledger-amount">${money(total)}${totalEquation?`<small class="ledger-equation">${totalEquation}</small>`:''}</td><td class="ledger-winning">${money(winning)}${winningEquation?`<small class="ledger-equation">${winningEquation}</small>`:''}</td></tr>`}).join('');
  return `<table class="ledger-table"><thead><tr><th>玩法</th><th>總量</th><th>中獎</th></tr></thead><tbody>${body}</tbody><tfoot><tr><td>${escapeHtml(totalLabel)}</td><td class="ledger-amount">${money(totals[0])}</td><td class="ledger-winning">${money(totals[1])}</td></tr></tfoot></table>`;
}
function renderLedgerDemo(){
  const summary=summarizeLedger(LEDGER_DEMO.sites);
  $('#betMetrics').hidden=true;$('#sites').hidden=true;$('#betsPanel').hidden=true;$('#clearAll').hidden=true;
  document.querySelector('header h1').textContent='同步器 · 總帳';
  $('#sync').classList.add('online');$('#sync b').textContent='昨日展示';
  $('#ledgerDemo').hidden=false;
  $('#ledgerDemo').innerHTML=`<div class="ledger-demo-head"><div><b>總帳報表展示</b><small>${LEDGER_DEMO.date}　${LEDGER_DEMO.game}／${LEDGER_DEMO.phase}</small></div><a class="tool" href="./">返回下注明細</a></div><div class="ledger-demo-note">此頁只顯示昨日已核對的四站資料，不會寫入正式下注資料庫，也不代表今日即時總帳。</div><section class="ledger-section primary"><div class="ledger-title"><b>所有已開啟網站總和</b><small>${LEDGER_DEMO.sites.length} 個網站</small></div>${ledgerTable(summary,'四站總計',true)}</section><div class="ledger-sites">${LEDGER_DEMO.sites.map(site=>`<section class="ledger-section"><div class="ledger-title"><b>${escapeHtml(site.source)}</b><small>帳號 ${escapeHtml(site.account)}</small></div>${ledgerTable(site.rows,'本站小計')}</section>`).join('')}</div>`;
}
function getBetAmount(b){const v=Number(b.betAmount);if(Number.isFinite(v)&&v>0)return v;if(b._sixBatch)return Number(b.potentialPayout||0);if(b.source==="風雲")return Number(b.stake||0);return Number(b.potentialPayout??b.stake??0)}
function getUnitAmount(b){const v=Number(b.unitAmount);if(Number.isFinite(v)&&v>0)return v;const isCar=/全車/.test(String(b.event||b.playType||''));if(isCar)return null;const fallback=Number(b.stake);return Number.isFinite(fallback)&&fallback>0?fallback:null}
function getCountLabel(b){const combo=Number(b.combinationCount),cars=Number(b.carCount);if(Number.isFinite(combo)&&combo>0)return `${combo}碰`;if(Number.isFinite(cars)&&cars>0)return `${cars}車`;if(/全車/.test(String(b.event||b.playType||''))){const fallback=Number(b.stake);if(Number.isFinite(fallback)&&fallback>0)return `${fallback}車`}return "—"}

function formatStructuredSelection(playType,selection,bet={}){
  const play=String(playType||"").trim();
  const raw=String(selection||"").trim();
  if(!raw)return "";
  const parts=raw.split("、").map(x=>x.trim()).filter(Boolean);

  if(bet.source==="喜"){
    return raw.split(/\n+/).map(line=>line.trim()).filter(Boolean).map(line=>{
      const fields=line.split("｜").map(value=>value.trim()).filter(Boolean);
      const cars=fields.map(value=>value.match(/^車數\s+(.+)$/)?.[1]).find(Boolean)||"未辨識";
      const carLabel=/車$/.test(cars)?cars.replace(/\s*車$/,"")+"車":cars;
      return `<div class="bet-line"><span>${escapeHtml(fields[1]||fields[0]||"")}</span><span class="detail-value">${escapeHtml(carLabel)}</span></div>`;
    }).join("");
  }

  // 柱碰：不依賴「、」或換行；直接依「第XX柱」切割，每柱固定直向一行。
  if(/柱碰/.test(play)){
    const pillars=[];
    const re=/(第\d{1,2}柱)\s*([\s\S]*?)(?=第\d{1,2}柱|$)/g;
    let m;
    while((m=re.exec(raw))){
      const label=m[1].trim();
      const values=m[2].trim().replace(/^[、,\s]+|[、\s]+$/g,"");
      pillars.push(`<div class="pillar-line"><span class="pillar-label">${escapeHtml(label)}</span><span class="pillar-values">${escapeHtml(values)}</span></div>`);
    }
    if(pillars.length)return pillars.join("");
    return parts.map(line=>`<div class="pillar-line"><span class="pillar-values">${escapeHtml(line)}</span></div>`).join("");
  }

  // 天碰：特碼 / 正碼各自一行
  if(/^天碰/.test(play)){
    const amountQueues=new Map();
    const detailPattern=/特碼\s*(\d{1,2}(?:\s*,\s*\d{1,2})*)\s*正碼\s*(\d{1,2}(?:\s*,\s*\d{1,2})*)(?:\s*顯示去除)?\s+\d+(?:\.\d+)?\s+\d+(?:\.\d+)?\s+(\d+(?:\.\d+)?)/g;
    for(const item of String(bet.rawText||"").matchAll(detailPattern)){
      const key=`${item[1].replace(/\s+/g,"")}|${item[2].replace(/\s+/g,"")}`;
      if(!amountQueues.has(key))amountQueues.set(key,[]);
      amountQueues.get(key).push(Number(item[3]));
    }
    const groups=raw.split(/\n|、(?=\s*特碼)/).map(x=>x.trim()).filter(Boolean);
    return groups.map(line=>{
      const m=line.match(/^特碼\s*([^／\n]+)／正碼\s*([^／\n]+)(?:／每碰\s*([\d.]+))?$/);
      if(!m)return `<div class="bet-line">${escapeHtml(line)}</div>`;
      const key=`${m[1].replace(/\s+/g,"")}|${m[2].replace(/\s+/g,"")}`;
      const embedded=Number(m[3]);
      const queue=amountQueues.get(key)||[];
      const amount=Number.isFinite(embedded)&&embedded>0?embedded:queue.shift();
      const amountText=Number.isFinite(amount)&&amount>0?money(amount):"未辨識";
      return `<div class="sky-group"><div class="pillar-label">特碼</div><div class="pillar-values">${escapeHtml(m[1].trim())}</div><div class="pillar-label">正碼</div><div class="pillar-values">${escapeHtml(m[2].trim())}</div><div class="pillar-label">每碰</div><div class="pillar-values sky-unit">${escapeHtml(amountText)}</div></div>`;
    }).join("");
  }

  // 特碼單碰：每個號碼與金額一行
  if(/特碼單碰/.test(play)){
    return parts.map(line=>{
      const m=line.match(/^(\d{1,2})\s+([\d.]+)$/);
      if(!m)return `<div class="bet-line">${escapeHtml(line)}</div>`;
      const amount=Number(m[2]);
      return `<div class="bet-line"><span>${m[1]}</span><span class="detail-value">${money(amount)}</span></div>`;
    }).join("");
  }

  // 全車單碰：每個號碼與車數一行
  if(/全車單碰/.test(play)){
    return parts.map(line=>{
      const m=line.match(/^(\d{1,2})\s+([\d.]+)車$/);
      if(!m)return `<div class="bet-line">${escapeHtml(line)}</div>`;
      return `<div class="bet-line"><span>${m[1]}</span><span class="detail-value">${m[2]}車</span></div>`;
    }).join("");
  }

  return escapeHtml(raw);
}


function isDeletedBet(b){
  if(b.deleted===true||b.isDeleted===true)return true;
  const haystack=[
    b.status,b.result,b.rawText,b.event,b.playType,b.selection,b.note,b.remark
  ].filter(v=>v!=null).join(" ");
  return /已刪單|刪單|已删除|已刪除|已取消|取消|已撤單|撤單|deleted|cancelled|canceled/i.test(haystack);
}

function dedupeExactBets(rows){
  const result=[],seen=new Map();
  rows.forEach(b=>{
    const second=String(b.placedAt||"").replace(/\.\d{1,3}(?=[+-]\d\d:\d\d|Z$)/,"");
    const isWind=b.source==="風雲",isKd=b.source==="喜";
    const isGateway=(isWind&&/\|gateway\|/.test(String(b.id||"")))||(isKd&&/\|kd-gateway-batch\|/.test(String(b.id||"")));
    const play=String(b.playType||"").replace(/\s+/g," ").trim();
    let selection=String(b.selection||"").replace(/\s+/g," ").trim();
    if(isWind&&play&&selection.startsWith(`${play} `))selection=selection.slice(play.length+1).trim();
    const kdDetails=isKd?String(b.selection||"").split(/\n+/).map(line=>{
      const fields=line.split("｜").map(value=>value.trim()),content=/^\d{1,2}$/.test(fields[1]||"")?fields[1].padStart(2,"0"):(fields[1]||"");
      return `${fields[0]||""}:${content}`;
    }).filter(Boolean).join(";"):"";
    const key=isKd
      ? [b.source,b.account,second,b.event,b.playType,kdDetails,Number(b.betAmount)||0,isDeletedBet(b)].join("|")
      : [b.source,b.account,second,b.event,b.playType,selection,b.stake,b.potentialPayout,b.unitAmount,b.combinationCount,b.carCount,b.betAmount,isDeletedBet(b)].join("|");
    const candidates=seen.get(key)||[];
    const existing=(isWind||isKd)
      ? candidates.find(item=>item._isGatewayRepresentation!==isGateway&&!item._representationMatched)
      : candidates[0];
    if(!existing){
      const item={...b,ids:[b.id],_isGatewayRepresentation:isGateway,_representationMatched:false};
      candidates.push(item);seen.set(key,candidates);result.push(item);return;
    }
    if(!existing.ids.includes(b.id))existing.ids.push(b.id);
    existing.reconciled=Boolean(existing.reconciled&&b.reconciled);
    if(isWind||isKd){
      existing._representationMatched=true;
      if(existing._isGatewayRepresentation&&!isGateway){
        const ids=existing.ids,reconciled=existing.reconciled;
        Object.assign(existing,b,{ids,reconciled,_isGatewayRepresentation:false,_representationMatched:true});
      }
    }
  });
  return result.map(({_isGatewayRepresentation,_representationMatched,...b})=>b);
}

function suppressKdLegacyRows(rows){
  const represented=new Map(),correctedBatches=new Map();
  const isBatch=b=>/\|kd-(?:gateway-)?batch\|/.test(String(b.id||""));
  const isWrongGroupAccount=b=>/^F\d{6}$/i.test(String(b.account||""));
  rows.filter(b=>b.source==="喜"&&isBatch(b)&&!isWrongGroupAccount(b)).forEach(batch=>{
    const second=String(batch.placedAt||"").replace(/\.\d{1,3}(?=[+-]\d\d:\d\d|Z$)/,"");
    const batchKey=[second,batch.event,batch.selection,Number(batch.betAmount)||""].join("|");
    correctedBatches.set(batchKey,(correctedBatches.get(batchKey)||0)+1);
    String(batch.selection||"").split(/\n+/).forEach(line=>{
      const fields=line.split("｜").map(value=>value.trim());
      const amount=fields.map(value=>value.match(/^下注金額\s+([\d.]+)$/)?.[1]).find(Boolean)||"";
      const key=[second,fields[0]||"",fields[1]||"",amount].join("|");
      const entry=represented.get(key)||{count:0,accounts:new Set()};
      entry.count+=1;
      if(batch.account)entry.accounts.add(String(batch.account));
      represented.set(key,entry);
    });
  });
  return rows.filter(b=>{
    if(b.source!=="喜")return true;
    const second=String(b.placedAt||"").replace(/\.\d{1,3}(?=[+-]\d\d:\d\d|Z$)/,"");
    if(isBatch(b)){
      if(!isWrongGroupAccount(b))return true;
      const batchKey=[second,b.event,b.selection,Number(b.betAmount)||""].join("|");
      const count=correctedBatches.get(batchKey)||0;
      if(!count)return true;
      correctedBatches.set(batchKey,count-1);
      return false;
    }
    const selection=String(b.selection||"").trim();
    const play=String(b.playType||b.event||"").trim();
    const content=selection.startsWith(`${play} `)?selection.slice(play.length+1).trim():selection;
    const key=[second,play,content,String(Number(b.betAmount??b.stake)||"")].join("|");
    const entry=represented.get(key);
    const account=String(b.account||"");
    if(!entry?.count||(!/^(?:未設定)?$/.test(account)&&!/^F\d{6}$/i.test(account)&&!entry.accounts.has(account)))return true;
    entry.count-=1;
    return false;
  });
}

const COLUMN_WIDTH_KEY='synchronizerColumnWidthsV1';
const DEFAULT_COLUMN_WIDTHS=[430,105,105,120,130,95,80];
const MIN_COLUMN_WIDTHS=[180,72,72,88,96,72,68];
function getColumnWidths(){
  try{
    const saved=JSON.parse(localStorage.getItem(COLUMN_WIDTH_KEY)||'null');
    if(Array.isArray(saved)&&saved.length===7&&saved.every(v=>Number.isFinite(Number(v))))return saved.map(Number);
  }catch{}
  return [...DEFAULT_COLUMN_WIDTHS];
}
function applyColumnWidths(widths){
  const table=document.querySelector('#betsTable');
  if(!table)return;
  if(window.matchMedia('(max-width:800px)').matches){table.style.width='100%';return;}
  const cols=[...table.querySelectorAll('colgroup col')];
  widths.forEach((w,i)=>{if(cols[i])cols[i].style.width=`${Math.max(MIN_COLUMN_WIDTHS[i],Number(w)||DEFAULT_COLUMN_WIDTHS[i])}px`});
  const total=widths.reduce((sum,w,i)=>sum+Math.max(MIN_COLUMN_WIDTHS[i],Number(w)||DEFAULT_COLUMN_WIDTHS[i]),0);
  table.style.width=`${Math.max(980,total)}px`;
}
function initColumnResize(){
  const table=document.querySelector('#betsTable');
  if(!table)return;
  let widths=getColumnWidths();
  applyColumnWidths(widths);
  const headers=[...table.querySelectorAll('thead th')];
  headers.forEach((th,index)=>{
    const handle=document.createElement('span');
    handle.className='col-resizer';
    handle.title='拖曳調整欄寬';
    th.appendChild(handle);
    let startX=0,startWidth=0;
    const onMove=e=>{
      const x=e.touches?.[0]?.clientX??e.clientX;
      const next=Math.max(MIN_COLUMN_WIDTHS[index],startWidth+(x-startX));
      widths[index]=Math.round(next);
      applyColumnWidths(widths);
      e.preventDefault?.();
    };
    const onUp=()=>{
      document.body.classList.remove('resizing');
      handle.classList.remove('active');
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      window.removeEventListener('touchmove',onMove);
      window.removeEventListener('touchend',onUp);
      localStorage.setItem(COLUMN_WIDTH_KEY,JSON.stringify(widths));
    };
    const onDown=e=>{
      if(window.matchMedia('(max-width:800px)').matches)return;
      startX=e.touches?.[0]?.clientX??e.clientX;
      startWidth=widths[index]||th.getBoundingClientRect().width;
      document.body.classList.add('resizing');
      handle.classList.add('active');
      window.addEventListener('mousemove',onMove);
      window.addEventListener('mouseup',onUp);
      window.addEventListener('touchmove',onMove,{passive:false});
      window.addEventListener('touchend',onUp);
      e.preventDefault();
    };
    handle.addEventListener('mousedown',onDown);
    handle.addEventListener('touchstart',onDown,{passive:false});
    handle.addEventListener('dblclick',e=>{
      widths[index]=DEFAULT_COLUMN_WIDTHS[index];
      applyColumnWidths(widths);
      localStorage.setItem(COLUMN_WIDTH_KEY,JSON.stringify(widths));
      e.stopPropagation();
    });
  });
  window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:800px)').matches)applyColumnWidths(widths)});
}
