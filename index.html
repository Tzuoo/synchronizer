<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同步器</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#22263a;--line:#2e3450;--text:#e8eaf6;--muted:#8790ae;--blue:#60a5fa;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--accent:#4f7cff;--shadow:rgba(0,0,0,.28)}
[data-theme=light]{--bg:#f5f0e8;--panel:#fffdf9;--panel2:#edeafb;--line:#c9c4dc;--text:#25253a;--muted:#68677c;--blue:#315fbd;--green:#16806c;--yellow:#b76a16;--red:#c34f5b;--accent:#586fc4;--shadow:rgba(74,65,105,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;padding:12px;border-bottom:1px solid var(--line);background:var(--bg)}h1{margin:0;text-align:center;font-size:19px;color:var(--blue)}.top{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px}.pill,.tool{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text)}.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--red)}.online .dot{background:var(--green);box-shadow:0 0 9px var(--green)}
main{max-width:1500px;margin:auto;padding:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 4px 18px var(--shadow)}.card{padding:14px}.card small{color:var(--muted)}.card strong{display:block;margin-top:7px;font:800 25px Consolas,monospace}.sites{display:flex;gap:6px;overflow:auto;padding:12px 0}.site{flex:none;padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--muted)}.site.active{border-color:var(--accent);color:var(--text)}
.panel{overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;background:var(--panel2)}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters input,.filters select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px}td small{display:block;margin-top:4px;color:var(--muted)}.money{color:var(--yellow);font-weight:800}.tag{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:8px;background:rgba(96,165,250,.16);color:var(--blue);font-size:11px}.check{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--yellow)}.check.done{color:var(--green)}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.panel-head{align-items:flex-start;flex-direction:column}.filters input{width:100%}}@media(max-width:480px){.metrics{grid-template-columns:1fr}.card strong{font-size:22px}}
.lock{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:#0f1117}.lock.hidden{display:none}.lock-box{width:min(390px,100%);padding:28px;border:1px solid #2e3450;border-radius:16px;background:#1a1d27;box-shadow:0 16px 50px rgba(0,0,0,.45);text-align:center}.lock-box h2{margin:0 0 8px;color:#60a5fa}.lock-box p{margin:0 0 18px;color:#8790ae}.lock-box input{width:100%;padding:12px;border:1px solid #2e3450;border-radius:9px;background:#0f1117;color:#e8eaf6}.lock-box button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:9px;background:#4f7cff;color:white;font-weight:700}.lock-error{min-height:22px;margin-top:10px;color:#f87171;font-size:14px}
.danger{border-color:#b42333!important;color:#f87171!important}.danger:hover{background:#b42333!important;color:#fff!important}
</style></head><body><div id="lock" class="lock"><form id="lockForm" class="lock-box"><h2>同步器</h2><p>請輸入密碼後繼續</p><input id="lockPassword" type="password" autocomplete="current-password" placeholder="密碼" autofocus><button type="submit">進入</button><div id="lockError" class="lock-error"></div></form></div><header><h1>同步器</h1><div class="top"><span id="sync" class="pill"><i class="dot"></i><b>連線中</b></span><button class="tool" id="theme">切換明暗</button><button class="tool danger" id="clearAll">清除全部資料</button></div></header>
<main><section class="metrics"><article class="card"><small>今日下注總額</small><strong id="total">$0</strong></article><article class="card"><small>待結算金額</small><strong id="pending">$0</strong></article><article class="card"><small>今日輸贏</small><strong id="result">$0</strong></article><article class="card"><small>未對帳筆數</small><strong id="unchecked">0 筆</strong></article></section><nav id="sites" class="sites"></nav>
<section class="panel"><div class="panel-head"><div><b>下注明細</b><small id="count"></small></div><div class="filters"><input id="query" placeholder="搜尋帳號、網站或投注內容"><select id="status"><option>全部狀態</option><option>待結算</option><option>已派彩</option><option>已取消</option><option>未對帳</option></select></div></div><div class="table-wrap"><table><thead><tr><th>時間／網站</th><th>帳號</th><th>賽事與投注內容</th><th>總和</th><th>下注金額</th><th>結果</th><th>狀態</th><th>對帳</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const lock=document.querySelector('#lock'),lockForm=document.querySelector('#lockForm'),lockPassword=document.querySelector('#lockPassword'),lockError=document.querySelector('#lockError');
if(sessionStorage.getItem('synchronizerUnlocked')==='yes')lock.classList.add('hidden');
lockForm.addEventListener('submit',e=>{e.preventDefault();if(lockPassword.value==='0827'){sessionStorage.setItem('synchronizerUnlocked','yes');lock.classList.add('hidden');lockPassword.value='';lockError.textContent=''}else{lockError.textContent='密碼錯誤，請重新輸入';lockPassword.select()}});
const API="https://live-bet-reconciliation.tsoyis0520.chatgpt.site/api/bets",names=["風雲","98","16","61","28","海勝","航海"];let bets=[],site="全部網站";const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat("zh-TW",{style:"currency",currency:"TWD",maximumFractionDigits:0}).format(Number(n)||0);
function groupedBets(){const groups=new Map;for(const b of bets){const key=`${b.source}|${b.account}|${b.event}|${b.placedAt}`,g=groups.get(key);if(!g){groups.set(key,{...b,ids:[b.id],oddsLabel:b.odds??'—'});continue}g.ids.push(b.id);g.selection+=`、${b.selection}`;g.stake=Number(g.stake||0)+Number(b.stake||0);g.result=g.result==null&&b.result==null?null:Number(g.result||0)+Number(b.result||0);g.reconciled=g.reconciled&&b.reconciled;if(!String(g.oddsLabel).split(' / ').includes(String(b.odds??'—')))g.oddsLabel+=` / ${b.odds??'—'}`;if(g.status!==b.status)g.status='多種狀態'}return[...groups.values()]}
function draw(){const groups=groupedBets(),q=$("#query").value.toLowerCase(),st=$("#status").value,filtered=groups.filter(b=>(site==="全部網站"||b.source===site)&&(st==="全部狀態"||(st==="未對帳"?!b.reconciled:b.status===st))&&(`${b.source} ${b.account} ${b.event} ${b.selection}`).toLowerCase().includes(q));$("#total").textContent=money(bets.reduce((s,b)=>s+Number(b.stake||0),0));$("#pending").textContent=money(bets.filter(b=>b.status==="待結算").reduce((s,b)=>s+Number(b.stake||0),0));$("#result").textContent=money(bets.reduce((s,b)=>s+Number(b.result||0),0));$("#unchecked").textContent=groups.filter(b=>!b.reconciled).length+" 批";$("#count").textContent=`共 ${filtered.length} 批符合條件`;$("#sites").innerHTML=["全部網站",...names].map(n=>`<button class="site ${site===n?'active':''}" data-site="${n}">${n}<small> ${n==='全部網站'?groups.length:groups.filter(x=>x.source===n).length}</small></button>`).join("");$("#rows").innerHTML=filtered.length?filtered.map(b=>{const isNav=b.source==="航海",content=isNav?String(b.selection).replace(new RegExp(`^${b.event}\\s*`),'').split('、').join('<br>'):b.selection,totalLabel=isNav&&b.odds!=null?`${b.odds}車`:b.oddsLabel;return `<tr><td><b>${new Date(b.placedAt).toLocaleTimeString('zh-TW')}</b><span class="tag">${b.source}</span></td><td>${b.account}</td><td><b>${b.event}</b><small>${content}</small></td><td>${totalLabel}</td><td class="money">${money(b.stake)}</td><td>${b.result==null?'—':money(b.result)}</td><td>${b.status}</td><td><button class="check ${b.reconciled?'done':''}" data-ids="${encodeURIComponent(JSON.stringify(b.ids))}" data-value="${!b.reconciled}">${b.reconciled?'已對帳':'待確認'}</button></td></tr>`}).join(''):`<tr><td colspan="8"><div class="empty">等待下注資料</div></td></tr>`}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());bets=((await r.json()).bets||[]).filter(b=>String(b.placedAt).slice(0,10)===today);$("#sync").classList.add("online");$("#sync b").textContent="同步中";draw()}catch{$("#sync").classList.remove("online");$("#sync b").textContent="連線失敗"}}
async function clearAll(){if(!confirm('確定要永久清除全部下注資料嗎？清除後無法復原。'))return;const r=await fetch(API,{method:'DELETE',headers:{'content-type':'application/json','x-admin-password':'0827'},body:JSON.stringify({confirm:'DELETE_ALL'})});if(!r.ok){alert('清除失敗，請稍後再試。');return}bets=[];draw();await load()}
document.addEventListener('click',async e=>{const s=e.target.closest('[data-site]');if(s){site=s.dataset.site;draw()}const c=e.target.closest('[data-ids]');if(c){const ids=JSON.parse(decodeURIComponent(c.dataset.ids));await Promise.all(ids.map(id=>fetch(API+'/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({reconciled:c.dataset.value==='true'})})));load()}});$("#query").oninput=draw;$("#status").onchange=draw;$("#theme").onclick=()=>{const v=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=v;localStorage.setItem('theme',v)};document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark';load();setInterval(load,2000);
$("#clearAll").onclick=clearAll;
</script></body></html>
